name: Alpha Stream Android CI

on:
  pull_request:
    branches: [master, alpha-stream-branding, alpha-stream-full-repair]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-stream-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, compatibility and Android bundles
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check Kotlin binary compatibility
        run: ./gradlew :library:checkKotlinAbi

      - name: Run stable debug unit tests
        run: ./gradlew :app:testStableDebugUnitTest

      - name: Run stable debug Android lint
        run: ./gradlew :app:lintStableDebug

      - name: Build stable debug APK
        run: ./gradlew :app:assembleStableDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: alpha-stream-stable-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # This validates the release variant but is deliberately unsigned.
      # Signing requires publisher-owned credentials and is not done in CI.
      - name: Build unsigned stable release Android App Bundle
        run: ./gradlew :app:bundleStableRelease

      - name: Upload unsigned release AAB for review
        uses: actions/upload-artifact@v7
        with:
          name: alpha-stream-unsigned-stable-release-aab
          path: app/build/outputs/bundle/stableRelease/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alpha-stream-verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            library/build/reports/
          if-no-files-found: ignore
          retention-days: 14
