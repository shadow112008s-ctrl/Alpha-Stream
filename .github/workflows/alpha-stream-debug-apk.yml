name: Alpha Stream Android debug APK

on:
  pull_request:
    branches: [master, alpha-stream-branding]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-stream-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, compatibility and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check Kotlin binary compatibility
        run: ./gradlew --no-daemon :library:checkKotlinAbi

      - name: Run stable debug unit tests
        run: ./gradlew --no-daemon :app:testStableDebugUnitTest

      - name: Run stable debug Android lint
        run: ./gradlew --no-daemon :app:lintStableDebug

      - name: Build stable debug APK
        run: ./gradlew --no-daemon :app:assembleStableDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: alpha-stream-stable-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
