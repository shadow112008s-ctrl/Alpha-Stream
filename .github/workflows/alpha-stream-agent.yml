name: Alpha Stream AI Maintenance Agent

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: alpha-stream-ai-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Review and safely improve Alpha Stream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          ref: alpha-stream-full-repair
          fetch-depth: 0

      - name: Check whether Claude API credentials are configured
        id: auth
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI coding is not enabled yet. Add ANTHROPIC_API_KEY as a repository Actions secret to enable Claude. The free Claude mobile app does not provide this API credential."
          fi

      - name: Run Claude maintenance agent
        if: steps.auth.outputs.configured == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the guarded Alpha Stream maintenance agent.
            Read ALPHA_STREAM_AGENT.md first and follow every rule.
            Repository: shadow112008s-ctrl/Alpha-Stream
            Work branch: alpha-stream-full-repair
            Existing draft PR base: alpha-stream-branding

            Review the latest repository state and recent Actions results.
            Find the highest-priority, clearly evidenced issue. Make only a small safe fix if justified.
            Do not merge, publish, release, deploy, change secrets/settings, or add unauthorized media sources.
            Never claim tests passed unless a matching CI run confirms it.
            If a blocker requires credentials, paid services, legal review, device testing, or user approval, do not guess; report it.
            If no safe change is needed, report that no change was made.
          claude_args: |
            --max-turns 8
            --model claude-sonnet-4-5-20250929
