name: Pre-release (manual publishing disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Explain publishing is disabled
        run: |
          echo "Automatic pre-release publishing is disabled."
          echo "Alpha Stream debug APKs are built as pull-request artifacts only."
          exit 1
